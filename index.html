<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <meta name="description" content="Меншік және әлеуметтік-экономикалық жүйе туралы интерактивті викторина.">
  <title>Меншік және әлеуметтік-экономикалық жүйе — викторина</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <div class="topline" aria-label="Білім беру викторинасы">
      <span class="topline-mark" aria-hidden="true">✦</span>
      Экономика · интерактивті викторина
    </div>

    <section class="quiz-card" aria-labelledby="page-title">
      <header class="heading">
        <p class="eyebrow">Өзіңізді сынап көріңіз</p>
        <h1 id="page-title" tabindex="-1">Біліміңді сына!</h1>
        <p class="subtitle">Меншік және әлеуметтік-экономикалық жүйе туралы негізгі білімді бекітуге арналған 20 сұрақ.</p>
      </header>

      <div id="quiz" aria-live="polite">
        <div class="progress-section">
          <div class="progress-meta">
            <span id="progress-label">Сұрақ 1 / 20</span>
            <span id="progress-percent">5%</span>
          </div>
          <div class="progress-track" id="progress-track" role="progressbar"
               aria-label="Викторинаның барысы" aria-valuemin="0"
               aria-valuemax="20" aria-valuenow="1">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>

        <div class="question-top">
          <p class="question-label">Бір жауапты таңдаңыз</p>
          <div class="score-chip">Ұпайлар: <strong id="score">0</strong></div>
        </div>
        <h2 id="question" tabindex="-1"></h2>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" aria-live="assertive"></p>
        <div class="actions">
          <button class="primary-button" id="next-button" type="button" hidden>
            Келесі сұрақ <span aria-hidden="true">→</span>
          </button>
        </div>
      </div>

      <div class="result" id="result" hidden aria-live="polite"></div>
    </section>
    <p class="footer-note">Нәтижені көру үшін жауапты таңдаңыз, содан кейін жалғастырыңыз.</p>
  </main>
</body>
</html>
